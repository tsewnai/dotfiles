# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,2

# Fallback for any unrecognized monitor (e.g. projector, new display)
# monitor=,preferred,auto,auto

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.6

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2

# HiDPI internal display (no serial — internal panel, stays on eDP-1)
monitor = eDP-1, 3456x2160@60, 0x1440, 2

# Left QHD — ASUS PB278, serial J1LMTF116908
monitor = desc:Ancor Communications Inc ASUS PB278 J1LMTF116908, 2560x1440@60, -2560x0, 1

# Center QHD — ASUS PB278, serial J9LMTF050838
monitor = desc:Ancor Communications Inc ASUS PB278 J9LMTF050838, 2560x1440@60, 0x0, 1

# Right portrait 1080p — Dell P2219H, serial GVY67W2
monitor = desc:Dell Inc. DELL P2219H GVY67W2, 1920x1080@59.95100, 2560x-240, 1, transform, 3

# Workspace assignments
workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:desc:Ancor Communications Inc ASUS PB278 J1LMTF116908, default:true
workspace = 3, monitor:desc:Ancor Communications Inc ASUS PB278 J9LMTF050838, default:true
workspace = 4, monitor:desc:Dell Inc. DELL P2219H GVY67W2, default:true
